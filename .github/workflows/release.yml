# On a version tag (v0.1.0 ...): build the QGIS plugin zip and the ArcGIS
# toolbox zip and attach them to a GitHub release. Not run yet: check the
# first release by hand.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the zips (stops if the vendored core or help files are stale)
        run: |
          python tools/package_qgis_plugin.py
          python tools/package_arcgis_toolbox.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
